version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: axon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: axon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application